  <style>
    .star { animation-name: twinkle; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .text { font-family: "SF Pro Display", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hdr { animation: breathe 7s ease-in-out infinite; }
    .beam { animation: beam 7.5s cubic-bezier(.45,0,.55,1) infinite; }
    .caret { animation: blink 1.05s steps(2, end) infinite; }
    @keyframes twinkle { 0%,100% { opacity: .18; } 50% { opacity: 1; } }
    @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes beam { 0% { transform: translateY(-40px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(372px); opacity: 0; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .star, .hdr, .beam, .caret { animation: none; }
      .star { opacity: .7; }
    }
  </style>

