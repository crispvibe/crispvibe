    .sheen { animation: sweep 9s linear infinite; }
    @keyframes sweep { 0% { transform: translateX(-900px); } 100% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .sheen { animation: none; opacity: 0; } }
  </style>

